# Cloudflare 官方 cloudflared 镜像（支持 ARM64）
IMAGE=cloudflare/cloudflared:latest
AUTOSTART=1
HOSTNAME=cloudflared

# Tunnel token 独立保存在此目录，不写入 Stack 配置，并以只读方式挂载
VOLUME=/data/adb/dockroot/volumes/cloudflared:/etc/cloudflared:ro
REQUIRED_FILE=/data/adb/dockroot/volumes/cloudflared/token

# apply 只刷新 DockRoot 配置并输出版本，不会连接 Tunnel
APPLY_COMMAND=/usr/local/bin/cloudflared
APPLY_ARG=version

# 正式启动 remotely-managed Tunnel
COMMAND=/usr/local/bin/cloudflared
ARG=tunnel
ARG=--no-autoupdate
ARG=--loglevel
ARG=info
ARG=--metrics
ARG=127.0.0.1:__METRICS_PORT__
ARG=run
ARG=--token-file
ARG=/etc/cloudflared/token

CHECK_PORT=__METRICS_PORT__
# /ready 只用于展示 Tunnel 是否已连上 Cloudflare；断网时不终止自动重连进程
READY_URL=http://127.0.0.1:__METRICS_PORT__/ready
