# 青龙官方 latest 镜像
IMAGE=whyour/qinglong:latest
AUTOSTART=1
HOSTNAME=__STACK_NAME__

# 青龙配置、任务、日志和依赖均持久化到 /ql/data
VOLUME=/data/adb/dockroot/volumes/__STACK_NAME__:/ql/data

ENV=QlPort=5700
ENV=QlGrpcPort=5501
ENV=QlBaseUrl=/
ENV=TZ=Asia/Shanghai

CHECK_PORT=5700
CHECK_PORT=5501
HEALTH_URL=http://127.0.0.1:5700/api/health
