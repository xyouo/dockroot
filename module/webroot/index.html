<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <title>DockRoot 容器</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main>
      <header>
        <div>
          <p class="eyebrow">DOCKROOT</p>
          <h1>容器入口</h1>
          <p class="subtitle">查看状态，打开或复制本机与局域网地址。</p>
        </div>
        <button id="refresh" class="icon-button" type="button" aria-label="刷新">刷新</button>
      </header>
      <section id="notice" class="notice" hidden></section>
      <section class="card wake-card" aria-live="polite">
        <div class="card-title">
          <h2>CPU 唤醒</h2>
          <span id="wake-status" class="status off"><i></i>正在读取</span>
        </div>
        <p id="wake-detail" class="url">正在读取唤醒模式…</p>
        <div id="wake-actions" class="actions">
          <button class="primary" data-wake="scheduled" type="button">定时短唤醒</button>
          <button data-wake="on" type="button">全天唤醒</button>
          <button class="danger" data-wake="off" type="button">关闭</button>
        </div>
      </section>
      <section id="containers" class="grid" aria-live="polite">
        <div class="loading">正在读取容器状态…</div>
      </section>
      <footer>
        保活仅在连续健康检查失败后自动恢复，不会定时重启正常容器。
      </footer>
    </main>
    <script type="module" src="app.js"></script>
  </body>
</html>
